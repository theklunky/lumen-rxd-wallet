[package]
name = "radiant-wallet"
version = "0.1.0"
description = "Radiant (RXD) wallet for macOS and Windows"
authors = ["Radiant Wallet"]
edition = "2021"

[lib]
name = "radiant_wallet_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-store = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
