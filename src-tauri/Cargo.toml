[package]
name = "lumen-wallet"
version = "0.1.0"
description = "Lumen RXD Wallet — non-custodial Radiant (RXD) wallet for macOS and Windows"
authors = ["Lumen RXD Wallet"]
license = "MIT"
edition = "2021"

[lib]
name = "lumen_wallet_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-store = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
