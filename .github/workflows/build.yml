# Builds installers for both platforms and publishes a GitHub Release on tags.
#
# Triggers: `v*` tags and manual dispatch only. This repo is private, and
# private-repo runners bill macOS at 10x / Windows at 2x, so we avoid burning
# minutes on every push to main.
#
# macOS artifacts: DMG (+ zipped .app)   Windows: NSIS installer, portable .exe
name: Build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write # required to create the release

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain (stable MSVC)
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Enable long path support
        run: |
          New-Item -ItemType Directory -Force -Path "C:\Program Files\Lumen RXD Wallet"

      - name: Install dependencies
        run: npm ci

      - name: Build (NSIS + MSI + raw binary)
        run: npm run tauri build

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/lumen-wallet.exe

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (app + DMG)
        id: build
        continue-on-error: true
        run: npm run tauri build

      - name: Verify the .app was produced
        run: test -d "src-tauri/target/release/bundle/macos/Lumen RXD Wallet.app"

      - name: Package .app (DMG is best-effort)
        run: |
          ditto -c -k --keepParent \
            "src-tauri/target/release/bundle/macos/Lumen RXD Wallet.app" \
            "Lumen-RXD-Wallet-macOS.app.zip"

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos
          if-no-files-found: warn
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            Lumen-RXD-Wallet-macOS.app.zip

  release:
    needs: [windows, macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Show artifacts
        run: find dist -type f | sort

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: Lumen RXD Wallet ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          files: |
            dist/**/*.dmg
            dist/**/*.zip
            dist/**/*.exe
