# Builds signed-ready installers on each platform.
# Windows artifacts (Tauri cannot cross-compile to Windows from macOS):
#   - NSIS installer  src-tauri/target/release/bundle/nsis/*.exe
#   - Portable binary src-tauri/target/release/lumen-wallet.exe
name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain (stable MSVC)
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Enable long path support
        run: |
          New-Item -ItemType Directory -Force -Path "C:\Program Files\Lumen Wallet"

      - name: Install dependencies
        run: npm ci

      - name: Build (NSIS + MSI + raw binary)
        run: npm run tauri build

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lumen-wallet-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/lumen-wallet.exe

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (DMG + app)
        run: npm run tauri build

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lumen-wallet-macos
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/macos/*.app